<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Input Type Split</title>

    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="card">

    <h2>Input type split</h2>

    <canvas id="myChart"></canvas>

    <div class="legend">

        <div class="item">
            <span class="dot purple"></span>
            <span id="textPercent"></span>
        </div>

        <div class="item">
            <span class="dot green"></span>
            <span id="voicePercent"></span>
        </div>

    </div>

    <div class="bottomText">
        Voice users avg
        <br>
        <b id="average"></b>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
